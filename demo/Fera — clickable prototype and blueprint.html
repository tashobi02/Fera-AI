<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fera — clickable prototype and blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-canvas:#07080a;--bg-surface:#0d0d0d;--bg-elevated:#101111;--bg-card:#121212;--bg-deep:#18191a;
  --bg-hover:#121212;--bg-selected:#17181a;
  --border:#242728;--border-subtle:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);
  --text-strong:#f4f4f6;--text-body:#cdcdcd;--text-muted:#9c9c9d;--text-faint:#6a6b6c;--text-disabled:#434345;
  --action-bg:#ffffff;--action-pressed:#e8e8e8;--action-fg:#000000;--link:#ffffff;--focus:#57c1ff;--scrim:rgba(0,0,0,.64);
  --info:#57c1ff;--info-soft:rgba(87,193,255,.15);--info-text:#57c1ff;
  --success:#59d499;--success-soft:rgba(89,212,153,.15);--success-text:#59d499;
  --warning:#ffc533;--warning-soft:rgba(255,197,51,.15);--warning-text:#ffc533;
  --danger:#ff6161;--danger-soft:rgba(255,97,97,.15);--danger-text:#ff6161;
  --keycap-start:#121212;--keycap-end:#0d0d0d;
  --shadow-1:none;--shadow-2:none;
  --st-purple:#d6b6f6;--st-sky:#62aef0;--st-pink:#ff64c8;--st-orange:#dd5b00;--st-teal:#2a9d99;--st-green:#1aae39;
  --ease:cubic-bezier(.2,.8,.2,1);--fast:120ms;--base:200ms;--slow:360ms;
  --font:"Inter","Noto Sans Bengali",-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg-canvas:#f6f5f4;--bg-surface:#ffffff;--bg-elevated:#ffffff;--bg-card:#f6f5f4;--bg-deep:#f6f5f4;
  --bg-hover:rgba(0,0,0,.04);--bg-selected:rgba(0,0,0,.05);
  --border:#e6e6e6;--border-subtle:rgba(0,0,0,.06);--border-strong:#dddddd;
  --text-strong:#000000;--text-body:#31302e;--text-muted:#615d59;--text-faint:#a39e98;--text-disabled:#a39e98;
  --action-bg:#0075de;--action-pressed:#005bab;--action-fg:#ffffff;--link:#0075de;--focus:#0075de;--scrim:rgba(15,15,15,.4);
  --info:#0075de;--info-soft:rgba(0,117,222,.1);--info-text:#0075de;
  --success:#1aae39;--success-soft:rgba(26,174,57,.12);--success-text:#237b2e;
  --warning:#dd5b00;--warning-soft:rgba(221,91,0,.1);--warning-text:#a8500a;
  --danger:#d4403f;--danger-soft:rgba(214,48,49,.1);--danger-text:#bf2c30;
  --keycap-start:#ffffff;--keycap-end:#f6f5f4;
  --shadow-1:rgba(0,0,0,.01) 0 .175px 1.041px,rgba(0,0,0,.02) 0 .8px 2.925px,rgba(0,0,0,.027) 0 2.025px 7.847px,rgba(0,0,0,.04) 0 4px 18px;
  --shadow-2:rgba(0,0,0,.01) 0 1px 3px,rgba(0,0,0,.02) 0 3px 7px,rgba(0,0,0,.02) 0 7px 15px,rgba(0,0,0,.04) 0 14px 28px,rgba(0,0,0,.05) 0 23px 52px;
  color-scheme:light;
}
@media (prefers-reduced-motion:reduce){:root{--fast:0ms;--base:0ms;--slow:0ms}*{animation-duration:0ms!important;transition-duration:0ms!important}}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
#app{height:100%}
body{margin:0;height:100%;background:var(--bg-canvas);color:var(--text-body);font-family:var(--font);font-size:14px;line-height:1.6;
  font-feature-settings:"calt","kern","liga","ss03";-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;font-feature-settings:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg-canvas),0 0 0 4px var(--focus);border-radius:6px}
a{color:var(--link);font-weight:500;text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4,p{margin:0}
p{text-wrap:pretty}
.mono{font-family:var(--mono);font-feature-settings:"tnum";letter-spacing:0}
.muted{color:var(--text-muted)}.faint{color:var(--text-faint)}.strong{color:var(--text-strong)}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ico.sm{width:14px;height:14px}.ico.lg{width:20px;height:20px}.ico.xl{width:24px;height:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ───── Shell ───── */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--bg-canvas)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand .mark{font-size:22px;font-weight:700;color:var(--text-strong);letter-spacing:-.25px;line-height:1}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--st-teal);margin-top:-12px}
.brand small{display:block;color:var(--text-faint);font-size:12px;line-height:1.3;margin-top:3px}
.nav{overflow:auto;padding:4px 8px 16px;flex:1}
.nav h6{margin:16px 10px 6px;font-size:12px;font-weight:600;color:var(--text-faint);letter-spacing:.125px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border:0;background:transparent;border-radius:6px;
  color:var(--text-body);cursor:pointer;text-align:left;font-size:14px;transition:background var(--fast) var(--ease)}
.nav-item .ico{color:var(--text-muted)}
.nav-item:hover{background:var(--bg-hover)}
.nav-item.on{background:var(--bg-selected);color:var(--text-strong);font-weight:500;box-shadow:inset 0 0 0 1px var(--border)}
.nav-item.on .ico{color:var(--text-strong)}
.nav-item .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--text-faint)}
.nav-item .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{border-top:1px solid var(--border);padding:12px 16px;font-size:12px;color:var(--text-faint);line-height:1.5}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);min-height:56px;flex-wrap:wrap}
.topbar .crumb{display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:14px;min-width:0}
.topbar .crumb b{color:var(--text-strong);font-weight:500}
.topbar .grow{flex:1}
.menu-btn{display:none}
.stage{flex:1;overflow:auto;min-height:0}
.stage-inner{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;padding:24px;align-items:start;max-width:1560px;margin:0 auto}
.stage-inner.no-notes{grid-template-columns:minmax(0,1fr)}
.stage-inner.doc{grid-template-columns:minmax(0,1fr);max-width:1240px}
.frame-col{min-width:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.notes{position:sticky;top:20px}

/* ───── Controls ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;border:1px solid transparent;
  font-size:14px;font-weight:500;letter-spacing:.2px;cursor:pointer;white-space:nowrap;transition:opacity var(--fast) var(--ease),background var(--fast) var(--ease),transform var(--fast) var(--ease);text-decoration:none!important}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--action-bg);color:var(--action-fg)}
.btn.primary:hover{opacity:.92}.btn.primary:active{background:var(--action-pressed)}
.btn.tertiary{background:var(--bg-elevated);color:var(--text-strong);border-color:var(--border)}
[data-theme="light"] .btn.tertiary{background:rgba(0,0,0,.05);border-color:transparent}
.btn.tertiary:hover{border-color:var(--border-strong)}
.btn.secondary{background:transparent;color:var(--text-strong);border-color:var(--border-strong)}
.btn.ghost{background:transparent;color:var(--text-body)}.btn.ghost:hover{background:var(--bg-hover)}
.btn.danger{background:var(--danger-soft);color:var(--danger-text)}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--bg-elevated);color:var(--text-disabled);border-color:var(--border);cursor:not-allowed;transform:none;opacity:1}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn.lg{height:44px;padding:0 20px;font-size:16px}
.btn.block{width:100%}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--text-muted);cursor:pointer}
.icon-btn:hover{color:var(--text-strong);background:var(--bg-hover)}
.kbd{display:inline-flex;align-items:center;height:20px;padding:1px 6px;border-radius:4px;border:1px solid var(--border);
  background:linear-gradient(180deg,var(--keycap-start),var(--keycap-end));color:var(--text-body);font-size:13px;line-height:1;font-family:var(--font)}
.btn.primary .kbd{background:rgba(0,0,0,.08);border-color:transparent;color:inherit}
.seg{flex-wrap:wrap;max-width:100%;display:inline-flex;padding:2px;gap:2px;border:1px solid var(--border);background:var(--bg-elevated);border-radius:8px}
.seg button{height:28px;padding:0 10px;border:1px solid transparent;background:transparent;border-radius:6px;font-size:13px;color:var(--text-muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--bg-deep);color:var(--text-strong);border-color:var(--border-strong)}
[data-theme="light"] .seg button.on{background:#fff;box-shadow:var(--shadow-1);border-color:var(--border)}
.badge{display:inline-flex;align-items:center;gap:6px;height:20px;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;letter-spacing:.2px;line-height:1;white-space:nowrap;
  background:var(--bg-elevated);color:var(--text-muted);border:1px solid var(--border)}
.badge.wrap{white-space:normal;height:auto;line-height:1.35}
.badge .ico{width:12px;height:12px}
.badge.info{background:var(--info-soft);color:var(--info-text);border-color:transparent}
.badge.success{background:var(--success-soft);color:var(--success-text);border-color:transparent}
.badge.warning{background:var(--warning-soft);color:var(--warning-text);border-color:transparent}
.badge.danger{background:var(--danger-soft);color:var(--danger-text);border-color:transparent}
.badge.dashed{border-style:dashed;border-color:var(--border-strong);background:transparent}
.input,.select,.textarea{min-width:0;width:100%;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-strong);font-size:16px}
.textarea{height:auto;padding:10px 12px;resize:none;line-height:1.6;min-height:96px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--border-strong);outline:none;box-shadow:var(--shadow-1)}
.input:focus-visible,.select:focus-visible,.textarea:focus-visible{box-shadow:0 0 0 2px var(--bg-canvas),0 0 0 4px var(--focus);border-radius:8px}
.input.err{border-color:var(--danger)}
.label{display:block;font-size:14px;font-weight:500;letter-spacing:.2px;color:var(--text-strong);margin-bottom:6px}
.hint{font-size:13px;color:var(--text-muted);margin-top:6px;line-height:1.4}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;color:var(--text-body)}
.check input{appearance:none;width:16px;height:16px;flex:none;margin:3px 0 0;border-radius:4px;border:1px solid var(--border-strong);background:var(--bg-elevated);display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--action-bg);border-color:var(--action-bg)}
.check input:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--action-fg);border-bottom:2px solid var(--action-fg);transform:rotate(-45deg) translate(1px,-1px)}
.switch{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--border-strong);position:relative;cursor:pointer;flex:none;transition:background var(--base) var(--ease);border:0;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform var(--base) var(--ease)}
.switch:checked{background:var(--action-bg)}.switch:checked::after{transform:translateX(14px);background:var(--action-fg)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--bg-surface);color:var(--text-strong);cursor:pointer;font-size:15px}
.chip:hover{background:var(--bg-hover)}
.chip.sm{height:28px;padding:0 10px;font-size:13px}
.chip.on{background:var(--info-soft);border-color:var(--info);color:var(--info-text)}

/* ───── Containers ───── */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.card.elev{background:var(--bg-elevated);border-color:var(--border-strong);border-radius:16px;box-shadow:var(--shadow-1)}
.card.dashed{border-style:dashed;border-color:var(--border-strong);background:transparent}
.well{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.tile{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted);flex:none}
.tile.info{background:var(--info-soft);border-color:transparent;color:var(--info)}
.tile.success{background:var(--success-soft);border-color:transparent;color:var(--success)}
.tile.warning{background:var(--warning-soft);border-color:transparent;color:var(--warning)}
.tile.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.125px;text-transform:uppercase;color:var(--text-faint);line-height:1.33}
.h1{font-size:40px;font-weight:700;line-height:1.1;letter-spacing:-1px;color:var(--text-strong)}
.h2{font-size:26px;font-weight:700;line-height:1.23;letter-spacing:-.625px;color:var(--text-strong)}
.h3{font-size:22px;font-weight:700;line-height:1.27;letter-spacing:-.25px;color:var(--text-strong)}
.title{font-size:20px;font-weight:600;line-height:1.4;letter-spacing:-.125px;color:var(--text-strong)}
.hsm{font-size:18px;font-weight:500;line-height:1.4;letter-spacing:.2px;color:var(--text-strong)}
.cap{font-size:13px;line-height:1.4;color:var(--text-muted)}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.between{justify-content:space-between}
.hr{height:1px;background:var(--border);border:0;margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:600;letter-spacing:.125px;text-transform:uppercase;color:var(--text-faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--border-subtle);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-family:var(--mono);font-feature-settings:"tnum";font-size:13px}
.tbl tbody tr.clickable{cursor:pointer}
.tbl tbody tr.clickable:hover td{background:var(--bg-hover)}
.tbl tbody tr.sel td{background:var(--bg-selected)}
.tbl-wrap{overflow-x:auto}

/* ───── Notes rail ───── */
.note-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.note-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.note-sec{padding:12px 16px;border-bottom:1px solid var(--border-subtle)}
.note-sec:last-child{border-bottom:0}
.note-sec dt{font-size:12px;color:var(--text-faint);margin-bottom:2px}
.note-sec dd{margin:0 0 8px;font-size:13px;color:var(--text-body);line-height:1.5}
.note-sec dd:last-child{margin-bottom:0}
.note-sec .row.wrap{gap:6px}
.note-sec .btn{white-space:normal;height:auto;min-height:28px;padding:4px 6px;text-align:left;line-height:1.35}

/* ───── Device frames ───── */
.device{width:390px;max-width:100%;border:1px solid var(--border-strong);border-radius:16px;overflow:hidden;background:var(--bg-canvas);box-shadow:var(--shadow-2)}
.addr{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--bg-deep);font-family:var(--mono);font-size:12px;color:var(--text-faint)}
.addr .ico{width:12px;height:12px}
.addr .path{color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk{width:100%;border:1px solid var(--border-strong);border-radius:16px;overflow:hidden;background:var(--bg-canvas);box-shadow:var(--shadow-2)}
.screen-phone{height:720px;display:flex;flex-direction:column;background:var(--bg-canvas);color:var(--text-body);font-size:18px;line-height:1.7;position:relative}
.screen-desk{min-height:640px;display:flex;flex-direction:column;background:var(--bg-canvas);position:relative}

/* product header (COMP-022) */
.app-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg-surface)}
.app-head .wm{font-size:20px;font-weight:700;color:var(--text-strong);letter-spacing:-.25px;display:flex;align-items:center;gap:6px}
.app-head .wm i{width:6px;height:6px;border-radius:50%;background:var(--st-teal);display:inline-block}
.app-head .grow{flex:1}
.lang-toggle{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:2px;background:var(--bg-elevated)}
.lang-toggle button{border:0;background:transparent;height:28px;padding:0 10px;border-radius:999px;font-size:13px;color:var(--text-muted);cursor:pointer;min-width:44px}
.lang-toggle button.on{background:var(--bg-selected);color:var(--text-strong);box-shadow:inset 0 0 0 1px var(--border)}
.demo-strip{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:12px;color:var(--text-muted);border-bottom:1px dashed var(--border-strong);background:var(--bg-canvas);line-height:1.4}
.demo-strip .ico{width:12px;height:12px}
.p-body{flex:1;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.p-foot{border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg-surface);display:flex;flex-direction:column;gap:10px}
.p-h1{font-size:28px;font-weight:700;line-height:1.25;letter-spacing:-.5px;color:var(--text-strong)}
.p-lead{font-size:18px;line-height:1.7;color:var(--text-body)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border);font-size:15px;line-height:1.6;color:var(--text-body)}
.notice .ico{margin-top:4px;color:var(--text-muted)}
.notice.info .ico{color:var(--info)}
.notice.warn .ico{color:var(--warning)}
.notice.dashed{border-style:dashed;border-color:var(--border-strong);background:transparent}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:86%;padding:10px 14px;border-radius:10px;font-size:17px;line-height:1.65}
.bubble.bot{align-self:flex-start;background:var(--bg-surface);border:1px solid var(--border);color:var(--text-strong);border-top-left-radius:4px}
.bubble.me{align-self:flex-end;background:var(--bg-card);border:1px solid var(--border-strong);color:var(--text-strong);border-top-right-radius:4px}
.bubble .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.typing{display:inline-flex;gap:8px;align-items:center;color:var(--text-muted);font-size:15px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:var(--text-strong);animation:spin 800ms linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.mic{width:72px;height:72px;border-radius:50%;border:1px solid var(--border-strong);background:var(--bg-surface);display:grid;place-items:center;cursor:pointer;color:var(--text-strong);box-shadow:var(--shadow-1);transition:transform var(--fast) var(--ease)}
.mic:active{transform:scale(.97)}
.mic.rec{background:var(--action-bg);color:var(--action-fg);border-color:var(--action-bg)}
.mic:disabled{color:var(--text-disabled);cursor:not-allowed;box-shadow:none}
.recbar{display:flex;align-items:center;gap:14px}
.timer{font-family:var(--mono);font-size:15px;color:var(--text-strong)}
.level{flex:1;height:6px;border-radius:999px;background:var(--border);overflow:hidden}
.level i{display:block;height:100%;width:0;background:var(--action-bg);transition:width var(--slow) var(--ease)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* field cards (COMP-028) */
.fcard{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fcard.unknown{border-style:dashed;border-color:var(--border-strong);background:transparent}
.fcard.missing{border-color:var(--warning)}
.fcard .k{font-size:14px;color:var(--text-muted);display:flex;align-items:center;gap:6px;justify-content:space-between}
.fcard .v{font-size:18px;color:var(--text-strong);font-weight:500;line-height:1.5}
.fcard .src{font-size:13px;color:var(--text-faint);line-height:1.4}
.fcard .edit-row{display:flex;gap:8px;margin-top:6px}
.ref-big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-1px;color:var(--text-strong);line-height:1.1}
.out-text{white-space:pre-wrap;font-size:15px;line-height:1.75;color:var(--text-strong);background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px;max-height:220px;overflow:auto}
.poster{background:#fff;color:#111;border:1px solid #e6e6e6;border-radius:8px;aspect-ratio:1080/1350;padding:18px 16px;display:flex;flex-direction:column;gap:8px;font-family:"Noto Sans Bengali",var(--font)}
.poster .ph{font-size:22px;font-weight:700;letter-spacing:-.25px;line-height:1.25}
.poster .pn{font-size:30px;font-weight:700;line-height:1.1}
.poster .pl{font-size:14px;line-height:1.6;color:#31302e}
.poster .pc{margin-top:auto;border-top:1px solid #e6e6e6;padding-top:10px;font-size:14px;line-height:1.5}
.poster .pf{font-size:11px;color:#615d59;border:1px dashed #a39e98;border-radius:4px;padding:2px 6px;align-self:flex-start}

/* desk app */
.d-nav > *{flex:none}
.d-nav{overflow-x:auto;scrollbar-width:none;display:flex;align-items:center;gap:6px;padding:0 16px;height:52px;border-bottom:1px solid var(--border);background:var(--bg-surface)}
.d-nav .wm{font-size:18px;font-weight:700;color:var(--text-strong);margin-right:10px;display:flex;align-items:center;gap:6px}
.d-nav .wm i{width:6px;height:6px;border-radius:50%;background:var(--st-teal);display:inline-block}
.d-nav .role{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:4px 10px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--text-body);font-size:14px;cursor:pointer;white-space:nowrap}
.pill:hover{background:var(--bg-hover)}
.pill.on{background:var(--bg-selected);border-color:var(--border);color:var(--text-strong)}
.pill .cnt{font-family:var(--mono);font-size:12px;color:var(--text-faint)}
.d-body{padding:24px;display:flex;flex-direction:column;gap:16px;flex:1}
.d-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.d-head .grow{flex:1;min-width:200px}
.d-title{font-size:26px;font-weight:700;letter-spacing:-.625px;line-height:1.23;color:var(--text-strong)}
.stats3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.625px;color:var(--text-strong);font-family:var(--mono);font-weight:500}
.stat .d{font-family:var(--mono);font-size:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.review-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.ev{width:100%;border-collapse:collapse}
.ev th{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.125px;color:var(--text-faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
.ev td{padding:10px;border-bottom:1px solid var(--border-subtle);font-size:14px;vertical-align:top;color:var(--text-strong)}
.ev td.f{color:var(--text-muted);white-space:nowrap}
.ev tr:last-child td{border-bottom:0}
.verdict{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;white-space:nowrap}
.verdict.m{color:var(--success-text)}.verdict.d{color:var(--danger-text)}.verdict.u{color:var(--text-muted)}
.unk{color:var(--text-faint);font-style:normal;border-bottom:1px dashed var(--border-strong)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:8px 0;position:relative}
.timeline li::before{content:"";position:absolute;left:11px;top:30px;bottom:-8px;width:1px;background:var(--border)}
.timeline li:last-child::before{display:none}
.timeline .m{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted)}
.timeline .m .ico{width:12px;height:12px}
.timeline .t{font-size:14px;color:var(--text-strong);font-weight:500}
.timeline .s{font-size:13px;color:var(--text-muted)}
.map-wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.bdmap{width:100%;height:auto;max-height:560px;display:block}
.bdmap path{stroke:var(--bg-canvas);stroke-width:.8;cursor:pointer;transition:fill-opacity var(--fast) var(--ease)}
.bdmap path:hover{stroke:var(--text-strong);stroke-width:1.2}
.bdmap path.sel{stroke:var(--text-strong);stroke-width:1.6}
.bdmap text{font-family:var(--mono);font-size:9px;fill:var(--text-strong);pointer-events:none}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.legend .ramp{display:flex;gap:2px}.legend .ramp i{width:14px;height:10px;border-radius:2px;background:var(--info)}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:16px;animation:fade var(--base) var(--ease)}
.scrim.fixed{position:fixed;z-index:100}
.dialog{width:min(480px,100%);background:var(--bg-surface);border:1px solid var(--border-strong);border-radius:16px;box-shadow:var(--shadow-2);overflow:hidden;animation:pop var(--base) var(--ease)}
.dialog .dh{padding:20px 20px 0;display:flex;gap:12px;align-items:flex-start}
.dialog .db{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;font-size:15px}
.dialog .df{background:var(--bg-deep);border-top:1px solid var(--border);padding:12px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.98)}}
.toasts{position:fixed;right:20px;bottom:76px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:calc(100vw - 40px)}
.toast{width:360px;max-width:100%;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-2);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;animation:rise var(--base) var(--ease)}
.toast .t{font-size:14px;font-weight:500;color:var(--text-strong)}
.toast .s{font-size:13px;color:var(--text-muted);line-height:1.4}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.journey{border-top:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;background:var(--bg-canvas);flex-wrap:wrap}
.jsteps{display:flex;gap:4px;flex:1;min-width:200px;overflow-x:auto;padding:2px}
.jstep{flex:1;min-width:22px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-faint);font-family:var(--mono);font-size:12px;cursor:pointer}
.jstep.done{background:var(--bg-card);color:var(--text-muted);border-color:var(--border)}
.jstep.done{color:var(--text-strong);border-color:var(--border-strong)}
.jstep.cur{background:var(--action-bg);color:var(--action-fg);border-color:var(--action-bg)}
.jlabel{font-size:13px;color:var(--text-muted);min-width:0;max-width:420px}
.jlabel b{color:var(--text-strong);font-weight:500}

/* blueprint */
.doc-head{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;max-width:760px}
.doc-sec{margin-top:40px;display:flex;flex-direction:column;gap:16px}
.doc-sec > p{max-width:720px;font-size:15px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.arch{width:100%;min-width:900px;height:auto;display:block}
.arch .bx{fill:var(--bg-surface);stroke:var(--border)}
.arch .bx.strong{fill:var(--bg-elevated);stroke:var(--border-strong)}
.arch .bx.dash{fill:none;stroke:var(--border-strong);stroke-dasharray:4 4}
.arch .grp{fill:none;stroke:var(--border);stroke-dasharray:2 4}
.arch .t1{font:500 13px var(--font);fill:var(--text-strong)}
.arch .t2{font:400 11px var(--font);fill:var(--text-muted)}
.arch .t3{font:600 10.5px var(--font);fill:var(--text-faint);letter-spacing:.4px}
.arch .ln{stroke:var(--text-faint);stroke-width:1.2;fill:none}
.arch .ln.dash{stroke-dasharray:4 4}
.arch .ah{fill:var(--text-faint)}
.pipe{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.pipe .st{flex:1;min-width:132px;background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pipe .st.human{border-color:var(--border-strong);background:var(--bg-elevated)}
.pipe .st.ai .who{color:var(--info-text)}
.pipe .st .who{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:6px}
.pipe .st .n{font-size:14px;font-weight:500;color:var(--text-strong);line-height:1.35}
.pipe .st .d{font-size:12.5px;color:var(--text-muted);line-height:1.45}
.pipe .ar{display:grid;place-items:center;width:20px;flex:none;color:var(--text-faint)}
.sm-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.state{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-surface);font-family:var(--mono);font-size:12.5px;color:var(--text-strong)}
.state.term{border-color:var(--border-strong);background:var(--bg-elevated)}
.state.dash{border-style:dashed;border-color:var(--border-strong);background:transparent}
.tl{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.gate{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.gate.now{border-color:var(--border-strong);background:var(--bg-elevated);box-shadow:var(--shadow-1)}
.gate .when{font-family:var(--mono);font-size:12px;color:var(--text-faint)}
.gate ul,.owner ul,.plain{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--text-body)}
.gate li,.owner li{margin:2px 0}
.prog{height:6px;border-radius:999px;background:var(--border);overflow:hidden}.prog i{display:block;height:100%;background:var(--action-bg)}
.owner{display:flex;flex-direction:column;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#000;flex:none}
.ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ol li::marker{font-family:var(--mono);color:var(--text-faint);font-size:12px}

/* responsive */
@media (max-width:1180px){.stage-inner{grid-template-columns:minmax(0,1fr)}.notes{position:static}.map-wrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:980px){.review-grid,.grid2{grid-template-columns:minmax(0,1fr)}.tl{grid-template-columns:minmax(0,1fr)}.cols3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.stats3{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:150;transform:translateX(-100%);transition:transform var(--base) var(--ease);padding-top:env(safe-area-inset-top,0px)}
  .shell.menu-open .side{transform:none}
  .menu-btn{display:inline-grid}
  .stage-inner{padding:16px}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .d-body{padding:16px}
  .jlabel{max-width:none;flex-basis:100%}
}
@media (max-width:640px){
  .topbar{min-height:48px;padding:6px 10px;gap:4px;flex-wrap:nowrap}
  .topbar .crumb{min-width:0;flex:1}.topbar .crumb>span,.topbar .crumb>svg,.topbar .crumb .badge,.topbar>.badge,.hide-sm{display:none}
  .topbar .crumb b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .grow{display:none}
  .journey{padding:8px 10px;gap:8px;flex-wrap:nowrap}.journey .eyebrow,.jlabel{display:none}.jstep{min-width:26px}
  .stage-inner{padding:12px}
  .d-body{padding:14px}.d-title{font-size:22px}
  .h1{font-size:30px}
}
@media (max-width:440px){.device{border-radius:10px}.screen-phone{height:calc(100dvh - 210px);min-height:560px}}

@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
</style>

/* Count model — BR-014: rows of each kind and confirmed pairs, never "unique children" */
function totals(){
  const t={};MAPDATA.forEach(d=>{const b=S.counts[d.en];t[d.en]={...b}});
  Object.values(S.cases).forEach(c=>{const r=t[c.district];if(!r)return;
    if(c.kind==="missing"){if(c.state==="submitted"||c.state==="open")r.mo++;else if(c.state==="closed")r.mc++;else r.mm++}
    else{if(c.state==="open")r.fo++;else if(c.state==="referred")r.fr++;else r.fm++}});
  S.cands.filter(c=>c.state==="confirmed").forEach(c=>{const r=t[S.cases[c.m].district];if(r)r.pairs++});
  if(!S.map.syn)Object.keys(t).forEach(k=>t[k]={mo:0,mm:0,mc:0,fo:0,fm:0,fr:0,pairs:0});
  const all={mo:0,mm:0,mc:0,fo:0,fm:0,fr:0,pairs:0};Object.values(t).forEach(r=>Object.keys(all).forEach(k=>all[k]+=r[k]));
  return{t,all}}

/* ───────── Extraction (scripted stand-in for STT → normaliser → LLM + evidence check) ───────── */
const AGEW={"সাত":7,"আট":8,"নয়":9,"দশ":10,"এগারো":11,"বারো":12,"তেরো":13,"চৌদ্দ":14,"পনেরো":15,"ষোলো":16,"সতেরো":17,"তিরিশ":30,"ত্রিশ":30};
function findDistrict(s){const low=s.toLowerCase();
  for(const d of MAPDATA){if(s.includes(d.bn)||low.includes(d.en.toLowerCase()))return{d:d.en,q:s.includes(d.bn)?d.bn:d.en}}
  for(const k in ALIAS){if(low.includes(k.toLowerCase())&&k!=="ঢাকা")return{d:ALIAS[k],q:k,alias:true}}return null}
function extract(text){
  const t=toAscii(text),f={},src={};
  let m=text.match(/আমার (ছেলে|মেয়ে)\s*([^\s,।]+)?/)||text.match(/my (son|daughter)\s*([A-Za-z]+)?/i);
  if(m){f.sex=/ছেলে|son/i.test(m[1])?"boy":"girl";src.sex=m[0];if(m[2]&&!/বয়স|age/i.test(m[2])){f.name=[m[2].replace(/[,।]/g,""),m[2]];src.name=m[0]}}
  else if(/\bboy\b|ছেলে/i.test(text)){f.sex="boy";src.sex=text.match(/\bboy\b|ছেলে/i)[0]}else if(/\bgirl\b|মেয়ে/i.test(text)){f.sex="girl";src.sex=text.match(/\bgirl\b|মেয়ে/i)[0]}
  if(/রাফি/.test(text)){f.name=["রাফি","Rafi"];}
  m=t.match(/(?:বয়স|age)\s*(\d{1,2})/i)||t.match(/(\d{1,2})\s*(?:বছর|years?)/i);
  if(m){f.age=+m[1];src.age=text.substr(t.indexOf(m[0]),m[0].length)}else{for(const w in AGEW){const i=text.indexOf("বয়স "+w);if(i>=0){f.age=AGEW[w];src.age="বয়স "+w;break}}}
  m=t.match(/01\d{9}/);if(m){f.phone=m[0];src.phone=text.substr(t.indexOf(m[0]),11)}
  m=text.match(/(নীল|লাল|সবুজ|হলুদ|কালো|সাদা|ধূসর)\s*(শার্ট|জামা|টি-শার্ট|প্যান্ট)[^।]*/);if(m){f.clothing=[m[0].replace(/\s*ছিল$/,""),m[0].includes("নীল শার্ট")?"Blue shirt and black trousers":m[0]];src.clothing=m[0]}
  m=text.match(/(গতকাল|আজ)\s*(সকাল|দুপুর|বিকেল|সন্ধ্যা|রাত)(?:ে|ে)?/);
  if(m){const day=m[1]==="গতকাল"?8:9,part=m[2],R={সকাল:["৬:০০–১২:০০","06:00–12:00"],দুপুর:["১২:০০–১৫:০০","12:00–15:00"],বিকেল:["১৫:০০–১৮:০০","15:00–18:00"],সন্ধ্যা:["১৮:০০–২০:০০","18:00–20:00"],রাত:["২০:০০–২৪:০০","20:00–24:00"]}[part];
    f.time=[`${bnum(day)} অক্টো, ${part} ${R[0]}`,`${day} Oct, ${R[1]}`];src.time=m[0]}
  if(/মাদ্রাসা/.test(text)&&/মিরপুর/.test(text)){f.place=["মিরপুরের মাদ্রাসা থেকে বাড়ি ফেরার পথে","On the way home from the madrasa, Mirpur"];src.place="মাদ্রাসা থেকে বাড়ি ফেরার পথে … মিরপুরে"}
  else{m=text.match(/([^\s,।]+)\s*(?:এর কাছে|থেকে|সামনে)/);if(m){f.place=[m[0],m[0]];src.place=m[0]}}
  const dd=findDistrict(text);if(dd&&!dd.alias){f.district=dd.d;src.district=dd.q}else if(dd&&dd.alias){S.intake.hintDistrict=dd}
  return{f,src}}

  I.msgs.forEach(m=>{body+=`<div class="bubble ${m.who}">${m.html?m.html():esc(m.text)}${m.meta?`<div class="meta">${m.meta}</div>`:""}</div>`});

    ${I.slowMsg?`<button class="btn ghost sm" data-a="go" data-s="S-005" style="align-self:flex-start">${L("ফর্মে লিখুন","Use the form")}</button>`:""}`;
  body+=`</div>`;
  if(I.err)body+=`<div class="notice">${ic(I.err.icon||"info")}<div style="flex:1">${I.err.msg}${I.err.retry?`<div style="margin-top:8px"><button class="btn tertiary sm" data-a="${I.err.retry}">${L("আবার পাঠান","Send again")}</button></div>`:""}</div></div>`;
  if(I.phase==="transcript")body+=`<div class="stack gap8"><label class="label" for="tr">${L("আপনার কথা (লিখে ঠিক করা যায়)","What you said (you can edit this)")}</label>

    <div class="row wrap gap8">${I.cached?cacheBadge():""}<span class="cap">${L("নাম ও সংখ্যা ঠিক আছে কি না দেখুন।","Check names and numbers.")}</span></div></div>`;
  if(I.phase==="asking"&&I.ask){const ch=chipsFor(I.ask);if(ch.length)body+=`<div class="chips" role="group" aria-label="${L("দ্রুত উত্তর","Quick replies")}">${ch.map(c=>`<button class="chip" data-a="answer" data-v="${esc(c.v)}" data-t="${esc(L(c.bn,c.en))}">${esc(L(c.bn,c.en))}</button>`).join("")}</div>`}
  if(I.phase==="complete")body+=`<div class="notice info">${ic("circle-check")}<div>${L("দরকারি সব তথ্য পাওয়া গেছে। জমা দেওয়ার আগে যাচাই করুন।","All required details are here. Review them before you submit.")}</div></div>`;
  if(I.phase==="review-unknown")body+=`<div class="notice warn">${ic("circle-alert")}<div>${L("কিছু আবশ্যক তথ্য এখনো অজানা। যাচাই পাতায় সেগুলো যোগ করুন।","Some required details are still unknown. Add them on the review page.")}</div></div>`;

  // footer controls
  let foot="";
  if(I.phase==="transcript")foot=`<button class="btn primary lg block" data-a="send-transcript">${ic("send")}${L("ঠিক আছে, পাঠান","OK, send")}</button>
    <button class="btn ghost sm" data-a="rerecord" style="align-self:center">${L("আবার রেকর্ড করুন","Record again")}</button>`;
  else if(I.phase==="complete"||I.phase==="review-unknown")foot=`<button class="btn primary lg block" data-a="go" data-s="S-003">${L("যাচাই করুন","Review details")}</button>`;
  else{
    const rec=I.phase==="recording";
    const micDis=S.scen.noMic||busy&&!rec||I.phase==="asking";
    foot=`${I.phase==="empty"||rec?`<div class="recbar">
        <button class="mic ${rec?"rec":""}" data-a="${rec?"rec-stop":"rec-start"}" ${micDis?"disabled":""} aria-label="${rec?L("রেকর্ডিং থামান","Stop recording"):L("ভয়েস রেকর্ড করুন","Record voice")}" aria-pressed="${rec}">${ic(rec?"square":"mic","xl")}</button>
        <div class="stack gap4" style="flex:1;min-width:0">
          <div class="row between"><span class="timer" id="rtimer">${N(fmtRec(I.recT))} / ${N("2:00")}</span><span class="cap" style="font-size:13px">${rec?L("শুনছি…","Listening…"):L("চাপ দিয়ে বলুন","Tap to speak")}</span></div>
          <div class="level"><i id="rlevel" style="width:${Math.min(100,I.recT/120*100)}%"></i></div>
          ${rec?`<span class="cap" style="font-size:12px">${L("ডেমোতে সময় দ্রুত চলছে","Time-compressed in this demo")}</span>`:""}
        </div></div>`:""}
      ${S.scen.noMic?`<p class="cap" style="font-size:14px">${ic("circle-alert","sm")} ${L("মাইক্রোফোন চালু করা যায়নি। আপনি লিখে জানাতে পারেন।","The microphone isn't available. You can type instead.")}</p>`:""}
      <div class="row gap8" style="align-items:flex-end">
        <label class="sr" for="tx">${L("লিখে জানান","Type instead")}</label>

        <button class="btn primary" style="height:44px;width:44px;padding:0" data-a="send-text" aria-label="${L("পাঠান","Send")}" ${busy?"disabled":""}>${ic("send")}</button></div>
      <div class="row between"><button class="btn ghost sm" data-a="go" data-s="S-005">${ic("file-input","sm")}${L("ফর্মে লিখুন","Use the form")}</button>
        ${I.phase!=="empty"?`<button class="btn ghost sm" data-a="discard">${L("খসড়া মুছুন","Discard draft")}</button>`:""}</div>`}
  return phone("/report",`${appHead()}<div class="p-body" id="pbody">${body}</div><div class="p-foot">${foot}</div>`)}
function fmtRec(t){return `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`}

/* intake actions */
let recTimer=null;
function recStart(){const I=S.intake;I.phase="recording";I.recT=0;I.err=null;S.flags.started=true;render();
  recTimer=setInterval(()=>{I.recT+=1;const tEl=$("#rtimer"),lEl=$("#rlevel");if(tEl)tEl.textContent=`${N(fmtRec(I.recT))} / ${N("2:00")}`;if(lEl)lEl.style.width=(I.recT/120*100)+"%";if(I.recT>=38)recStop()},100)}
function recStop(){clearInterval(recTimer);const I=S.intake;if(I.phase!=="recording")return;I.phase="sending";I.calls++;render();
  setTimeout(()=>{I.phase="transcript";I.transcript=RAFI_SCRIPT;I.cached=true;S.flags.transcript=true;render()},900)}
function sendUser(text,kind,val){const I=S.intake;
  if(S.scen.offline){I.err={icon:"wifi-off",msg:L("ইন্টারনেট সংযোগ নেই। আপনার তথ্য রাখা আছে — সংযোগ ফিরলে আবার পাঠান।","No internet. Your details are saved — send again when back online."),retry:"retry-send"};I.pendingSend={text,kind};render();return}
  I.err=null;
  if(kind!=="answer"&&toAscii(text).trim().length<20){I.err={icon:"pencil",msg:L("আরও একটু বিস্তারিত লিখুন","Please add a little more detail")};render();return}
  I.msgs.push({who:"me",text,meta:kind==="voice"&&I.cached?cacheBadge():""});
  if(kind==="answer"){applyAnswer(text,val);return}
  I.phase="understanding";I.slowMsg=false;I.calls++;render();
  const slow=S.scen.slow;if(slow)setTimeout(()=>{if(I.phase==="understanding"){I.slowMsg=true;render()}},1300);
  setTimeout(()=>{
    if(S.scen.aiFail){I.calls++;I.phase="empty";S.manual.banner=true;
      const {f,src}=extract(text);I.fields={...I.fields,...f};I.src={...I.src,...src};I.sourceText=text;
      toast("info",L("সহকারী তথ্য গুছাতে পারেনি","The assistant couldn't organise this"),L("ফর্মটি পূরণ করুন — আপনার লেখা রাখা আছে।","Please fill the form — your text is kept."));go("S-005");return}
    const {f,src}=extract(text);I.sourceText=text;I.fields={...I.fields,...f};I.src={...I.src,...src};
    let pre="";if(typeof f.age==="number"&&f.age>17){pre=L(`বয়স "${bnum(f.age)}" শোনা গেছে — বয়স ০ থেকে ১৭-এর মধ্যে হতে হবে। `,`I heard age "${f.age}" — age must be 0 to 17. `);delete I.fields.age}
    I.msgs.push({who:"bot",text:pre+L("ধন্যবাদ। আপনার কথা থেকে খসড়া তৈরি হয়েছে।","Thank you. A draft was made from your words.")});
    S.flags.sent=true;nextQuestion()},slow?2600:1200)}
function nextQuestion(){const I=S.intake,miss=missingReq(I.fields);
  if(!I.fields.district&&!miss.includes("district"))miss.push("district");
  if(!miss.length){I.phase="complete";I.ask=null;I.msgs.push({who:"bot",text:L("সব তথ্য পাওয়া গেছে।","That's everything we need.")});S.flags.complete=true;render();return}
  if(I.rounds>=4){I.phase="review-unknown";I.ask=null;render();return}
  const k=miss[0],nm=I.fields.name?v2(I.fields.name):"";I.ask=k;I.rounds++;I.phase="asking";
  I.msgs.push({who:"bot",text:L(...QUESTIONS[k](nm))});render();
  setTimeout(()=>{const t=$("#tx");if(t&&k!=="sex")t.focus()},30)}
function applyAnswer(raw,val){const I=S.intake,k=I.ask,t=toAscii(raw);let ok=true;
  if(k==="age"){const m=t.match(/\d{1,2}/);let a=m?+m[0]:AGEW[raw.trim()];if(a!=null&&a<=17){I.fields.age=a;I.src.age=L("আপনার উত্তর","Your answer")}else ok=false}
  else if(k==="sex"){const v=SEX[val]?val:Object.keys(SEX).find(s=>SEX[s].some(x=>x===raw.trim())||s===raw);if(v){I.fields.sex=v;I.src.sex=L("আপনার উত্তর","Your answer")}else ok=false}
  else if(k==="district"){const d=DIST[val]?{d:val}:findDistrict(raw);if(d){I.fields.district=d.d;I.src.district=raw}else ok=false}
  else if(k==="time"){const rv=val||raw;if(rv.includes("|")){const[d,p]=rv.split("|");const R={সকাল:["৬:০০–১২:০০","06:00–12:00"],বিকেল:["১৫:০০–১৮:০০","15:00–18:00"],সন্ধ্যা:["১৮:০০–২০:০০","18:00–20:00"]}[p];I.fields.time=[`${bnum(d)} অক্টো, ${p} ${R[0]}`,`${d} Oct, ${R[1]}`]}else I.fields.time=[raw,raw];I.src.time=L("আপনার উত্তর","Your answer")}
  else if(k==="phone"){const m=t.match(/01\d{9}/);if(m){I.fields.phone=m[0];I.src.phone=L("আপনার উত্তর","Your answer")}else ok=false}
  else if(k==="place"){if(raw.trim().length>1){I.fields.place=[raw,raw];I.src.place=L("আপনার উত্তর","Your answer")}else ok=false}
  if(!ok){I.msgs.push({who:"bot",text:k==="phone"?L("০১ দিয়ে শুরু ১১ সংখ্যার নম্বর দিন","Enter an 11-digit number starting 01"):k==="age"?L("বয়স ০ থেকে ১৭-এর মধ্যে দিন","Enter an age from 0 to 17"):k==="district"?L("তালিকা থেকে জেলা বেছে নিন","Pick a district from the list"):L("একটি বেছে নিন","Choose one")});render();return}
  if(k==="district")S.flags.district=true;
  setTimeout(nextQuestion,350);render()}

/* ───────── S-003 Review ───────── */
const SRC_LABELS=["আপনার উত্তর","Your answer","আপনি যোগ করেছেন","You added this","ফর্মে দেওয়া","Entered in the form"];
function draftRows(){const f=S.intake.fields,src=S.intake.src;
  return["name","age","sex","place","district","time","clothing","phone"].map(k=>{
    let val=f[k];let txt=null;
    if(k==="age"&&typeof val==="number")txt=L(`${bnum(val)} বছর`,`${val} years`);
    else if(k==="sex"&&val)txt=sexL(val);
    else if(k==="district"&&val)txt=dName(val);
    else if(k==="phone"&&val)txt=N(val);
    else if(val)txt=v2(val);
    return{k,txt,req:REQ.includes(k),src:src[k]}})}
function scrReview(){
  const rows=draftRows(),miss=rows.filter(r=>r.req&&!r.txt),R=S.review;
  const can=R.checked&&!miss.length;
  let b=`<div class="stack gap4"><h1 class="p-h1">${L("যা বুঝেছি","What we understood")}</h1>
    <p class="cap" style="font-size:15px">${miss.length?L(`${bnum(6-miss.length)}/৬টি আবশ্যক তথ্য পাওয়া গেছে। বাকিগুলো যোগ করুন।`,`${6-miss.length} of 6 required details found. Add the rest.`):L("৬/৬টি আবশ্যক তথ্য পাওয়া গেছে।","6 of 6 required details found.")}</p></div>`;
  if(miss.length)b+=`<div class="notice warn">${ic("circle-alert")}<div>${L("অজানা আবশ্যক তথ্য:","Unknown required details:")} <b class="strong">${miss.map(r=>L(...FIELD_LBL[r.k])).join(", ")}</b>
    <div style="margin-top:6px"><button class="btn tertiary sm" data-a="go" data-s="S-005">${L("ফর্মে পূরণ করুন","Complete in the form")}</button></div></div></div>`;
  rows.forEach(r=>{const editing=R.edit===r.k;
    b+=`<div class="fcard ${!r.txt?(r.req?"unknown missing":"unknown"):""}">
      <div class="k"><span>${L(...FIELD_LBL[r.k])}${r.req?"":` <span class="faint">· ${L("ঐচ্ছিক","optional")}</span>`}</span>
        ${editing?"":`<button class="icon-btn" style="width:32px;height:32px" data-a="edit-field" data-k="${r.k}" aria-label="${L("সম্পাদনা","Edit")} ${L(...FIELD_LBL[r.k])}">${ic("pencil")}</button>`}</div>
      ${editing?editorFor(r.k):`<div class="v">${r.txt?esc(r.txt):`<span class="unk">${L("অজানা — যোগ করুন","Unknown — add")}</span>`}</div>
      ${r.src?`<div class="src">${L("উৎস","Source")}: ${SRC_LABELS.includes(r.src)?esc(r.src):"“"+esc(r.src)+"”"}</div>`:""}`}
      ${R.err[r.k]?`<div class="src" id="e-${r.k}" style="color:var(--warning-text)">${R.err[r.k]}</div>`:""}
    </div>`});
  const foot=`<p class="cap" style="font-size:13px">${L("জমা দেওয়ার আগে তথ্য যাচাই করুন। ফেরা পুলিশে জিডি জমা দেয় না।","Review before submission. Fera does not file a police GD.")}</p>
    <label class="check" style="font-size:16px"><input type="checkbox" data-ch="review-check" ${R.checked?"checked":""}>${L("আমি যাচাই করেছি","I have checked")}</label>
    <button class="btn primary lg block" data-a="submit" ${can?"":"disabled"}>${S.review.submitting?`<span class="spin"></span>${L("জমা হচ্ছে…","Submitting…")}`:(S.correcting&&S.cases["M-7K3Q2A"]?L("সংশোধন জমা দিন","Submit correction"):L("যাচাই করে জমা দিন","Check and submit"))}</button>`;
  return phone("/report/review",`${appHead(`<button class="icon-btn" data-a="go" data-s="S-002" aria-label="${L("পিছনে","Back")}">${ic("arrow-left")}</button>`)}<div class="p-body">${b}</div><div class="p-foot">${foot}</div>`)}
function editorFor(k){const f=S.intake.fields;
  if(k==="sex")return `<div class="chips">${Object.keys(SEX).map(s=>`<button class="chip sm ${f.sex===s?"on":""}" data-a="set-sex" data-v="${s}">${sexL(s)}</button>`).join("")}</div>`;
  if(k==="district")return `<select class="select" id="ed" data-a-change="1">${MAPDATA.slice().sort((a,b)=>a.en.localeCompare(b.en)).map(d=>`<option value="${d.en}" ${f.district===d.en?"selected":""}>${L(d.bn+" / "+d.en,d.en+" / "+d.bn)}</option>`).join("")}</select>
    <div class="edit-row"><button class="btn tertiary sm" data-a="save-field" data-k="district">${L("রাখুন","Save")}</button><button class="btn ghost sm" data-a="cancel-edit">${L("বাতিল","Cancel")}</button></div>`;
  let v=f[k];v=k==="age"&&typeof v==="number"?N(v):k==="phone"&&v?N(v):Array.isArray(v)?v2(v):(v||"");
  return `<input class="input" id="ed" value="${esc(v)}" ${k==="age"?'inputmode="numeric"':k==="phone"?'inputmode="tel"':""} aria-describedby="e-${k}">
    <div class="edit-row"><button class="btn tertiary sm" data-a="save-field" data-k="${k}">${L("রাখুন","Save")}</button><button class="btn ghost sm" data-a="cancel-edit">${L("বাতিল","Cancel")}</button></div>`}
function saveField(k){const f=S.intake.fields,el=$("#ed");const raw=el?el.value:"";const t=toAscii(raw).trim();S.review.err={};
  if(k==="age"){const n=parseInt(t,10);if(isNaN(n)||n<0||n>17){S.review.err.age=L("বয়স ০ থেকে ১৭-এর মধ্যে দিন","Enter an age from 0 to 17");render();return}f.age=n}
  else if(k==="phone"){if(!/^01\d{9}$/.test(t)){S.review.err.phone=L("০১ দিয়ে শুরু ১১ সংখ্যার নম্বর দিন","Enter an 11-digit number starting 01");render();return}f.phone=t}
  else if(k==="district")f.district=raw;
  else{if(!raw.trim()&&REQ.includes(k)){S.review.err[k]=L("এই তথ্যটি দরকার","This detail is required");render();return}f[k]=raw.trim()?[raw.trim(),raw.trim()]:null}
  S.intake.src[k]=L("আপনি যোগ করেছেন","You added this");S.review.edit=null;render()}

/* submit (API-003, idempotent UUID) */
function doSubmit(){if(S.review.submitting)return;S.review.submitting=true;render();
  setTimeout(()=>{S.review.submitting=false;submitRafi();S.flags.submitted=true;go("S-004")},900)}
function submitRafi(fromSeed){
  if(S.cases["M-7K3Q2A"])return;
  const f=S.intake.fields;
  S.submitUuid=S.submitUuid||"5f0c2a7e-91d3-4b8a-a6e2-"+(Math.random().toString(16).slice(2,14).padEnd(12,"0"));
  const c={...RAFI,name:f.name||["রাফি","Rafi"],sex:f.sex||"boy",age:typeof f.age==="number"?[f.age,f.age]:[13,13],district:f.district||"Dhaka",
    place:f.place||["মিরপুরের মাদ্রাসা থেকে বাড়ি ফেরার পথে","On the way home from the madrasa, Mirpur"],time:f.time||["৮ অক্টো, বিকেল ১৫:০০–১৮:০০","8 Oct, 15:00–18:00"],
    clothing:f.clothing||["নীল শার্ট আর কালো প্যান্ট","Blue shirt and black trousers"],marks:null,phone:f.phone||"01700000000",created:tick(4)};
  S.cases[c.id]=c;addAudit([c.id],"case.submitted","parent (anonymous)","uuid "+S.submitUuid.slice(0,8));
  c.state="open";addAudit([c.id],"case.opened","system");
  // matching runs: national exact retrieval → decoy qualifies at 58
  S.cands.push({id:"C-21",m:c.id,f:"F-8N5K2D",score:58,state:"pending",why:["একই লিঙ্গ ও বয়স; পাশের জেলা; হারানোর পরে পাওয়া। পোশাকের রং আলাদা।","Same sex and age; adjacent district; found after last seen. Clothing colour differs."]});

       if(n>2&&!S.flags.sent){S.intake.transcript=S.intake.transcript.replace("তিরিশ","তেরো");const t=S.intake.transcript;S.intake.msgs.push({who:"me",text:t,meta:cacheBadge()});
         const {f,src}=extract(t);S.intake.fields=f;S.intake.src=src;S.intake.msgs.push({who:"bot",text:L("ধন্যবাদ। আপনার কথা থেকে খসড়া তৈরি হয়েছে।","Thank you. A draft was made from your words.")});
         S.intake.ask="district";S.intake.rounds=1;S.intake.phase="asking";S.intake.msgs.push({who:"bot",text:L(...QUESTIONS.district("রাফি"))});S.flags.sent=true}}

function jGo(i){const J=JOURNEY[i];S.jstep=i;ensureUpTo(i);

   case 10:S.map.sel="Dhaka";S.map.metric="mc";S.flags.mapSeen=true;S.screen="S-011";render();toast("success","Journey complete","One synthetic report reached a known coordination status.");break;}}

 redact:()=>{const n=3+Object.values(S.cases).filter(c=>c.state==="closed"&&!c.redacted).length-S.admin.redacted;Object.values(S.cases).filter(c=>c.state==="closed").forEach(c=>{c.redacted=true;addAudit([c.id],"case.redacted",S.session.user)});
   S.admin.redacted+=n;S.admin.typed="";toast("success",L(`${bnum(n)}টি রিপোর্টের পরিচয় তথ্য অপসারণ করা হয়েছে`,`${n} reports payload-redacted`),L("আইডি, তারিখ, জেলা ও অডিট লিংক রাখা হয়েছে।","IDs, dates, district and audit links kept."));render()},
 import:()=>{const lines=S.admin.importText.split("\n").filter(x=>x.trim());let ok=0,bad=0;lines.forEach(l=>{try{const j=JSON.parse(l);j.synthetic===true?ok++:bad++}catch(e){bad++}});
   S.admin.imported=L(`${bnum(ok)}টি আমদানি হয়েছে · ${bnum(bad)}টি বাদ (সিনথেটিক চিহ্ন নেই)`,`${ok} imported · ${bad} rejected (not marked synthetic)`);render()},
 dupe:el=>{const D=S.dupe;if(D.reason.trim().length<3){D.err=true;render();return}D.err=false;S.dupes[0].state=el.dataset.v;S.dupes[0].reason=D.reason;
   addAudit([S.dupes[0].a,S.dupes[0].b],"duplicate.reviewed",S.session.user,el.dataset.v);toast("success",L("নথিভুক্ত হয়েছে","Recorded"),L("দুটি রিপোর্টই দৃশ্যমান থাকবে।","Both reports remain visible."));render()},

 try:el=>{const k=el.dataset.k;
   if(k==="unknown-phone"){delete S.intake.fields.phone;delete S.intake.src.phone;render()}
   else if(k==="replay")toast("info",L("এই রিপোর্ট আগেই জমা হয়েছে।","Already submitted."),L("নম্বর: M-7K3Q2A · একই UUID-তে একই উত্তর (200)","Ref: M-7K3Q2A · same UUID returns the same case (200)"));
   else if(k==="kam-fill"){S.found.saved=null;foundFill();render()}
   else if(k==="si-wrong"){S.signin.p="wrong";doSignin()}
   else if(k==="si-nasrin"){S.signin.u="officer.nasrin";S.signin.p="demo-pass";doSignin()}
   else if(k==="stale"){const c=S.cands.find(x=>x.id===S.param.cand);if(c){S.cases[c.f].v++;addAudit([c.f],"case.edited","staff (new version)");S.review2.stale=true;S.review2.checks=[false,false,false];render()}}
   else if(k==="nf"){S.param.nfPath="/officer/case/M-4D8P1M";S.screen="S-016";render();setTimeout(()=>{const h=$("#nf-h");h&&h.focus()},30)}},
};
function doCorrection(){const c=S.cases["M-7K3Q2A"],f=S.intake.fields;
  if(!["submitted","open","matched_pending_review"].includes(c.state)){toast("warning",L("সংশোধন বন্ধ","Editing locked"),L("মিল নিশ্চিত হওয়ার পর কেস বদলানো যায় না।","Can't edit after a match is confirmed."));return}
  Object.assign(c,{age:[f.age,f.age],sex:f.sex,district:f.district,place:f.place,time:f.time,clothing:f.clothing,phone:f.phone,name:f.name||c.name});c.v++;
  S.cands.filter(x=>x.state==="pending"&&x.m===c.id).forEach(x=>{x.state="voided";const o=S.cases[x.f];if(!pendingFor(o.id).length&&o.state==="matched_pending_review")o.state="open"});
  addAudit([c.id],"case.edited","parent (anonymous)","v"+c.v+" · pending candidates voided");
  const add=(id,fid,score,why)=>{S.cands.push({id,m:c.id,f:fid,score,state:"pending",why});S.cases[fid].state="matched_pending_review"};
  add("C-21v"+c.v,"F-8N5K2D",58,S.cands.find(x=>x.id==="C-21").why);if(S.cases["F-5Q9L3X"]&&S.cases["F-5Q9L3X"].state!=="referred")add("C-31v"+c.v,"F-5Q9L3X",87,["একই লিঙ্গ; বয়সের পরিসর মেলে; পোশাকের বর্ণনা মেলে (নীল শার্ট); একই জেলা; হারানোর পরে পাওয়া।","Same sex; age ranges overlap; clothing matches (blue shirt); same district; found after last seen."]);
  c.state="matched_pending_review";addAudit([c.id],"match.rerun","system");S.correcting=false;
  toast("success",L("সংশোধন জমা হয়েছে","Correction submitted"),"v"+c.v);go("S-006")}

/* ───────── Events ───────── */
function setPath(p,v){const ks=p.split(".");let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
root.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||!root.contains(el)&&!el.closest(".toasts"))return;
  if(el.disabled||el.getAttribute("aria-disabled")==="true")return;const f=act[el.dataset.a];if(!f)return;
  if(el.tagName==="A"||el.dataset.a!=="dlg-bg")e.preventDefault&&el.tagName==="A"&&e.preventDefault();
  if(el.type==="radio"){S.closeDlg.outcome=el.dataset.v;S.closeDlg.err=false;render();return}
  f(el,e)});
root.addEventListener("input",e=>{const el=e.target;if(el.dataset.in){setPath(el.dataset.in,el.value);
  if(el.dataset.live){const b=$("#ad-btn");if(b)b.disabled=el.value.trim()!=="বেনামী"}}});
root.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.chv){setPath(el.dataset.chv,el.value);render();return}
  const k=el.dataset.ch;if(!k)return;const v=el.checked;
  ({"review-check":()=>S.review.checked=v,ack:()=>S.out.ack=v,"found-ageunk":()=>S.found.ageUnk=v,"found-check":()=>S.found.checked=v,"q-keys":()=>S.queue.keys=v,
    "r2-check":()=>S.review2.checks[+el.dataset.i]=v,"map-syn":()=>S.map.syn=v,verify:()=>{const u=S.users[+el.dataset.i];u.verified=v;addAudit([],"user.verify",S.session.user,u.u+" → "+v);
      if(S.session&&S.session.user===u.u)S.session.verified=v},
    scen:()=>{const kk=el.dataset.k;if(kk==="qEmpty")S.queue.empty=v;else if(kk==="qFail")S.queue.fail=v;else S.scen[kk]=v}})[k]?.();render()});
document.addEventListener("keydown",e=>{const t=e.target,typing=t&&(t.tagName==="INPUT"&&t.type!=="checkbox"&&t.type!=="radio"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable);
  if(e.key==="Escape"){if(S.dialog){S.dialog=null;render()}else if(S.menu){S.menu=false;render()}return}
  if(S.dialog){if(e.key==="Tab"){const f=[...root.querySelectorAll(".dialog button,.dialog input,.dialog textarea")];if(f.length){const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}}return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.screen==="S-009"&&S.queue.keys){const rows=queueRows();
    if(e.key==="j"||e.key==="ArrowDown"){S.queue.sel=Math.min(rows.length-1,S.queue.sel+1);e.preventDefault();render();root.querySelector("tr.sel")?.focus()}
    else if(e.key==="k"||e.key==="ArrowUp"){S.queue.sel=Math.max(0,S.queue.sel-1);e.preventDefault();render();root.querySelector("tr.sel")?.focus()}
    else if(e.key==="Enter"&&rows[S.queue.sel]){act["open-cand"]({dataset:{c:rows[S.queue.sel].top.id}})}
    else if(e.key==="?"){S.queue.help=!S.queue.help;render()}}
  else if(S.screen==="S-010"&&S.queue.keys){
    if(e.key==="c"){if(S.review2.checks.every(Boolean)&&!S.review2.stale)act["confirm-open"]();else toast("info",L("চেকলিস্ট পূরণ করুন","Tick the checklist first"),"")}
    else if(e.key==="r")act["reject-open"]()}
  else if(e.key==="Enter"&&t&&t.matches&&t.matches("tr[data-a]")){t.click()}});

/* ───────── Init ───────── */
function baseTotals(){const a=totals().all;return{...a,fo:a.fo+a.fm}}
let S=freshState();S.jstep=0;S.base=baseTotals();
render();
